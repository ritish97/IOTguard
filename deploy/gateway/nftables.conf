#!/usr/sbin/nft -f
# IoTGuard Tier 1 Edge Gateway Firewall Configuration
# Implements Production Pillar 2: Fail-Open Network Architecture

# Dedicated table to isolate IDS rules from system routing and NAT
table inet iotguard {
    # Level 2 Containment: Specific (Source Device . Destination IP) pairs
    set blocked_dst {
        type ipv4_addr . ipv4_addr
        flags interval, timeout
        comment "Level 2 Block: Drop C2 & Payload Download connections only"
    }

    # Level 3 Containment: Quarantined Device IPs (All Forwarded Traffic Cut)
    set quarantined_dev {
        type ipv4_addr
        flags interval, timeout
        comment "Level 3 Quarantine: Drop all forwarded traffic for infected device"
    }

    # Dedicated forward chain with priority -10 (before standard firewall chains)
    # CRITICAL: Default policy is ACCEPT (Fail-Open Design).
    # If the Python IDS process crashes, forwarded Internet traffic continues routing uninterrupted.
    chain forward {
        type filter hook forward priority -10; policy accept;

        # Level 3: Drop all forwarded packets originating from quarantined devices
        ip saddr @quarantined_dev counter drop comment "IoTGuard Level 3 Device Quarantine"

        # Level 2: Drop traffic between infected devices and malicious C2/Payload destinations
        ip saddr . ip daddr @blocked_dst counter drop comment "IoTGuard Level 2 Destination Block"
    }
}
